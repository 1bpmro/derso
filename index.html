<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A3C6E">

    <title>DERSO 1º BPM - Solicitação</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="./manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DERSO">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>

<body>

<div class="container">
    <div id="barraProgresso"></div>

    <header class="header">
        <div class="logos">
            <img src="https://rondonia.ro.gov.br/wp-content/uploads/2024/09/Brasao-PMRO-370x523.png" alt="Brasão PMRO" loading="eager">
            <img src="https://museu.pm.ro.gov.br/wp-content/uploads/2024/05/1-bpm-3.png" alt="1º BPM" loading="eager">
        </div>
        <h2>DERSO 1º BPM</h2>
        <div class="divisor"></div>
        <p class="subtitle">Formulário de Solicitação de Diária Especial de Reforço do Serviço Operacional</p>
    </header>

    <div id="loadingScreen" class="loading-container">
        <div class="spinner"></div>
        <p id="loadingText">Sincronizando dados...</p>
    </div>

    <div id="formContent" class="is-hidden">
        <section id="prazoBox" aria-live="polite">
            <strong class="prazoTitulo">STATUS DO SISTEMA</strong>
            <div id="timerDisplay">⌛ CALCULANDO PRAZO...</div>
            <div id="consultaFechada" class="is-hidden">
                <input type="text" id="matriculaConsulta" placeholder="Matrícula para consulta" inputmode="numeric" autocomplete="off">
                <button type="button" class="btn btn-outline" id="btnHistoryFechado">📂 VER SOLICITAÇÕES</button>
            </div>
        </section>

        <div id="instMessage"></div>

        <form id="dersoForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" name="matricula" inputmode="numeric" required autocomplete="off">
                <span id="erroMatricula" class="is-hidden" aria-live="assertive">⚠️ MATRÍCULA NÃO LOCALIZADA</span>
            </div>

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" readonly tabindex="-1">
            </div>

            <div class="form-group">
                <label>Tipo de Folga</label>
                <div class="radio-group" id="radioFolga">
                    <input type="radio" id="f24" name="folga" value="24H" required><label for="f24">24H</label>
                    <input type="radio" id="f48" name="folga" value="48H"><label for="f48">48H</label>
                    <input type="radio" id="f72" name="folga" value="72H"><label for="f72">72H</label>
                    <input type="radio" id="f96" name="folga" value="96H"><label for="f96">96H</label>
                    <input type="radio" id="fLE" name="folga" value="FOLGA LE"><label for="fLE">LE</label>
                    <input type="radio" id="f1" name="folga" value="1ª Folga"><label for="f1">1ª FOLGA</label>
                    <input type="radio" id="f2" name="folga" value="2ª Folga"><label for="f2">2ª FOLGA</label>
                    <input type="radio" id="fExp" name="folga" value="Expediente"><label for="fExp">EXP</label>
                </div>
            </div>

            <div class="form-group">
                <label for="data">Data da Folga</label>
                <input type="date" id="data" name="data" required>
                <small id="infoPeriodo"></small>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="btnHistory">📂 VER MINHAS SOLICITAÇÕES</button>
                <button type="submit" class="btn btn-primary" id="btnEnviar">ENVIAR SOLICITAÇÃO</button>
            </div>
        </form>
       <div id="historyContent" class="is-hidden"></div> 
    </div>

    <footer class="footer" id="footerText"></footer>
</div>

<div id="modalMsg" class="modal is-hidden"></div>

<script type="module" src="main.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
</script>
</body>
</html>
